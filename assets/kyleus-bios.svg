<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">.Kyleus BIOS — personal profile</title>
  <desc id="desc">A black retro BIOS screen with a white .Kyleus identity and system-ready indicator.</desc>
  <defs>
    <pattern id="scanlines" width="2" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="#d5e2d2" opacity=".08"/>
    </pattern>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111513"/>
      <stop offset=".55" stop-color="#050706"/>
      <stop offset="1" stop-color="#0a0d0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="#020303"/>
  <rect x="22" y="20" width="1156" height="260" fill="url(#glass)" stroke="#424744"/>
  <path d="M400 21v258M815 21v258M22 83h1156M22 219h1156" fill="none" stroke="#d2ddd2" stroke-opacity=".11"/>
  <rect x="23" y="21" width="1154" height="258" fill="url(#scanlines)"/>
  <text x="58" y="59" fill="#929b94" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="2">// KYLEUS BIOS · PERSONAL PROFILE</text>
  <text x="58" y="151" fill="#f4f5f3" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="1">.Kyleus✞</text>
  <text x="61" y="188" fill="#9ca59e" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="1.5">PERSONAL BIO / PROFILE README</text>
  <text x="61" y="253" fill="#c5ccc6" font-family="Consolas, 'Courier New', monospace" font-size="17" letter-spacing="2">CODE  //  MUSIC  //  GAMES</text>
  <text x="866" y="58" fill="#929b94" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="1.4">BIOS VERSION 1.0</text>
  <circle cx="870" cy="105" r="4" fill="#a7d79b"/>
  <text x="886" y="110" fill="#d4ddd5" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="1.4">SYSTEM READY</text>
  <text x="866" y="253" fill="#929b94" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="1.4">PERSONAL ARCHIVE // 2026</text>
