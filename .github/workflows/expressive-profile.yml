name: Expressive Profile

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - .profile/icons.json
      - portfolio/projects.json
      - portfolio/render.mjs
      - portfolio/full-stats.mjs
      - .github/workflows/expressive-profile.yml

permissions:
  contents: write

concurrency:
  group: expressive-profile-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Expressive renderer
        uses: actions/checkout@v4
        with:
          repository: metawka/expressive-profile
          ref: f852b8a36dc83923d374b2bcba03652338000049
          path: .expressive-renderer
          persist-credentials: false
      - name: Render profile and selected project cards
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const file = ".expressive-renderer/action/render.mjs";
          const cfg = JSON.parse(readFileSync("profile.json", "utf8"));
          const labels = Object.fromEntries(cfg.socials.items.filter(s => s.label).map(s => [s.url, s.label]));
          let source = readFileSync(file, "utf8");
          const marker = "function g2(r,t){";
          if (!source.includes(marker)) throw new Error("Social label patch target missing");
          source = source.replace(marker, marker + "let custom=" + JSON.stringify(labels) + ";if(Object.hasOwn(custom,t.url))return custom[t.url];");
          source = source.replace('alt:s.icon.replace("brand:","")', 'alt:g2({brand:{}},s)');
          // Retain original alt text for unlabeled links.
          source = source.replace('alt:g2({brand:{}},s)', 'alt:(' + JSON.stringify(labels) + ')[s.url]??s.icon.replace("brand:","")');
          writeFileSync(file, source);
          NODE
          node .expressive-renderer/action/render.mjs
          node portfolio/render.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Render full repository statistics
        run: node portfolio/full-stats.mjs
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
      - name: Commit profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md assets .profile portfolio/*.svg
          git diff --cached --quiet || (git commit -m "chore: refresh expressive profile" && git push)
