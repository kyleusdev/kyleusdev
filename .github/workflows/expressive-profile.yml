name: Archive Profile

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - .profile/icons.json
      - portfolio/projects.json
      - portfolio/render.mjs
      - portfolio/full-stats.mjs
      - portfolio/archive.mjs
      - .github/workflows/expressive-profile.yml

permissions:
  contents: write

concurrency:
  group: expressive-profile-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Expressive renderer
        uses: actions/checkout@v4
        with:
          repository: metawka/expressive-profile
          ref: f852b8a36dc83923d374b2bcba03652338000049
          path: .expressive-renderer
          persist-credentials: false
      - name: Fetch activity and profile artwork
        run: node .expressive-renderer/action/render.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Render archive profile
        run: node portfolio/archive.mjs
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
      - name: Commit profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md assets .profile portfolio/*.svg
          git diff --cached --quiet || (git commit -m "chore: refresh expressive profile" && git push)
